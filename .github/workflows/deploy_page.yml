name: Deploy Sphinx documentation to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Free up space on the runner
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          docker system prune -af || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            docs/requirements.txt
            pyproject.toml

      # Install dependencies for video rendering
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-glx libglew-dev libosmesa6-dev

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip wheel setuptools
          pip install -r docs/requirements.txt
          pip install -e .

      # Render motion videos with headless MuJoCo
      - name: Render motion gallery videos
        run: |
          mkdir -p docs/_static/motion_gallery/videos docs/_static/motion_gallery/thumbnails
          xvfb-run -a python docs/render_motion_videos.py --output docs/_static/motion_gallery
        env:
          MUJOCO_GL: osmesa

      - name: Build Sphinx
        run: |
          sphinx-build -b html docs/ _build/html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
