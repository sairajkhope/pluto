name: Render Motion Gallery Videos

on:
  push:
    branches: [main]
    paths:
      - 'motion/*.lz4'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Needed for releases

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # In case motion files use LFS

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libosmesa6 libglfw3 xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip wheel setuptools
          pip install -e .
          pip install opencv-python pillow tqdm

      - name: Render videos
        run: |
          cd docs
          # Use virtual framebuffer for headless rendering
          xvfb-run -a python render_motion_videos.py --output _static/motion_gallery

      - name: Create video archive
        run: |
          cd docs/_static/motion_gallery
          tar -czvf motion_videos.tar.gz videos/ thumbnails/

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: motion-gallery-assets
          name: Motion Gallery Assets
          files: docs/_static/motion_gallery/motion_videos.tar.gz
          body: |
            Auto-generated motion gallery videos and thumbnails.
            Updated: ${{ github.event.head_commit.timestamp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
